version: "3.8"

services:
  # MongoDB
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - gozarish
    env_file:
      - .env.backend

  # Redis — cache for the public landing page. Optional: the backend falls back
  # to an in-process cache when REDIS_URL is unset or Redis is unreachable, so
  # this service can be removed without breaking anything.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Pure cache: no persistence, and evict rather than run out of memory.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - gozarish

  # Backend (Deno)
  backend:
    build:
      context: ./back
      target: production
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongo:27017/gozarish
      - REDIS_URL=redis://redis:6379
      - ENV=production
      - APP_PORT=1405
    ports:
      - "1405:1405"
    depends_on:
      - mongo
      - redis
    networks:
      - gozarish

  # Frontend (Next.js)
  frontend:
    build:
      context: ./front
      target: production
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_LESAN_URL=http://localhost:1405
      - LESAN_URL=http://backend:1405
      - APP_PORT=3005
    ports:
      - "3005:3005"
    depends_on:
      - backend
    networks:
      - gozarish

volumes:
  mongo-data:

networks:
  gozarish:
    driver: bridge
