version: "3.8"

services:
  # MongoDB
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - gozarish-dev

  # Redis — cache for the public landing page. Optional: the backend falls back
  # to an in-process cache when REDIS_URL is unset or Redis is unreachable.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - gozarish-dev

  # Backend (Deno)
  backend:
    build:
      context: ./back
      target: development
    ports:
      - "1405:1405"
    volumes:
      - ./back:/app
      - /app/deps
    environment:
      - MONGO_URI=mongodb://mongo:27017/gozarish
      - REDIS_URL=redis://redis:6379
      - ENV=development
      - APP_PORT=1405
    depends_on:
      - mongo
      - redis
    networks:
      - gozarish-dev

  # Frontend (Next.js)
  frontend:
    build:
      context: ./front
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./front:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_LESAN_URL=http://localhost:1405
      - LESAN_URL=http://localhost:1405
      - APP_PORT=3000
    depends_on:
      - backend
    networks:
      - gozarish-dev

volumes:
  mongo-data:

networks:
  gozarish-dev:
    driver: bridge
